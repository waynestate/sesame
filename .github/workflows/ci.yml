# The GitHub mirror's CI. It calls the Preflight reusable workflow, which runs
# `composer ci` on each PHP version listed here.
name: CI

on:
  push:
    branches: ['**']
    tags: ['v*', '*.*.*']

permissions:
  contents: read

jobs:
  ci:
    # pin to a Preflight tag at its first GitHub release
    uses: waynestate/preflight/.github/workflows/php-package.yml@41c2e98da81591229e771a35476e2fea2eb1cef8 # 0.9.0
    with:
      php-versions: '["8.3","8.4","8.5"]'
      ci-command: composer ci
