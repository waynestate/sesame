; The legacy app's own config, unchanged by the move. The [wayneauth] keys
; are still passed to new WayneAuth(...) and the bridge ignores them.

[general]
url_root = "https://app.test/"

[wayneauth]
sso_host = sso.example.test
sso_port = 10144
timeout = 10

[auth]
enabled = true
authorized_ids = "ab1234,cd5678"
login_url = "https://sso.example.test/login/?forward_url="
